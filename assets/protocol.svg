<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690">
  <defs>
    <pattern id="pr-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#635bff" stroke-opacity="0.05" />
    </pattern>
    <marker id="ar-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#635bff" />
    </marker>
    <marker id="ar-m" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8a93ab" />
    </marker>
    <marker id="ar-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#d97706" />
    </marker>
    <marker id="ar-r" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#df1b41" />
    </marker>
    <marker id="ar-i" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#3d34d6" />
    </marker>
  </defs>

  <rect width="1000" height="690" fill="#f7f8fb" />
  <rect x="14" y="14" width="972" height="662" rx="14" fill="#ffffff" />
  <rect x="14" y="14" width="972" height="662" rx="14" fill="url(#pr-grid)" />
  <rect x="14" y="14" width="972" height="662" rx="14" fill="none" stroke="#e3e8ee" stroke-width="1.5" />

  <text x="40" y="48" font-family="'Geist Mono','Fira Code',monospace" font-size="15" font-weight="700" fill="#1a1f36">mandated_purchase &#183; sequence</text>
  <text x="40" y="68" font-family="'Geist Mono','Fira Code',monospace" font-size="13" fill="#697386">agent &#8594; agentpay &#8594; store &#8594; settle &#183; payment rail intentionally mocked</text>

  <!-- lifelines -->
  <g stroke="#d7dcf0" stroke-width="1" stroke-dasharray="4 5">
    <line x1="95" y1="96" x2="95" y2="560" />
    <line x1="285" y1="96" x2="285" y2="560" />
    <line x1="495" y1="96" x2="495" y2="560" />
    <line x1="710" y1="96" x2="710" y2="560" />
    <line x1="905" y1="96" x2="905" y2="560" />
  </g>

  <!-- lane headers -->
  <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
    <rect x="25" y="74" width="140" height="42" rx="8" fill="#ffffff" stroke="#e3e8ee" />
    <text x="95" y="91" font-size="14" font-weight="700" fill="#1a1f36">user</text>
    <text x="95" y="108" font-size="13" fill="#697386">mandate owner</text>

    <rect x="210" y="74" width="150" height="42" rx="8" fill="#ffffff" stroke="#e3e8ee" />
    <text x="285" y="91" font-size="14" font-weight="700" fill="#1a1f36">agent</text>
    <text x="285" y="108" font-size="13" fill="#697386">mcp client</text>

    <rect x="410" y="74" width="170" height="42" rx="8" fill="#f0efff" stroke="#635bff" />
    <text x="495" y="91" font-size="14" font-weight="700" fill="#3d34d6">agentpay</text>
    <text x="495" y="108" font-size="13" fill="#5b51e8">mandate registry</text>

    <rect x="605" y="74" width="210" height="42" rx="8" fill="#ffffff" stroke="#e3e8ee" />
    <text x="710" y="91" font-size="14" font-weight="700" fill="#1a1f36">store</text>
    <text x="710" y="108" font-size="13" fill="#697386">@agentpay/merchant-sdk</text>

    <rect x="840" y="74" width="130" height="42" rx="8" fill="#ffffff" stroke="#d97706" stroke-dasharray="4 3" />
    <text x="905" y="91" font-size="14" font-weight="700" fill="#9a4c00">vault</text>
    <text x="905" y="108" font-size="13" fill="#9a4c00">mocked rail</text>
  </g>

  <g font-family="'Geist Mono','Fira Code',monospace" font-size="13" fill="#3c4257" text-anchor="middle">

    <!-- 01 discovery -->
    <text x="497" y="136">01 discovery &#183; GET /.well-known/agentpay.json</text>
    <line x1="285" y1="144" x2="704" y2="144" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 02 manifest -->
    <text x="497" y="166">02 manifest &#183; merchant id &#183; categories</text>
    <line x1="710" y1="174" x2="291" y2="174" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 03 create_mandate -->
    <text x="390" y="196">03 create_mandate(scope, limits)</text>
    <line x1="285" y1="204" x2="489" y2="204" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 04 draft + authorization_url -->
    <text x="390" y="226">04 draft + authorization_url</text>
    <line x1="495" y1="234" x2="291" y2="234" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 05 passkey sign -->
    <text x="295" y="256">05 passkey sign &#183; registry co-signs &#8594; active</text>
    <line x1="95" y1="264" x2="489" y2="264" stroke="#3d34d6" stroke-width="1.8" marker-end="url(#ar-i)" />

    <!-- 06 check_purchase -->
    <text x="390" y="286">06 check_purchase (dry run)</text>
    <line x1="285" y1="294" x2="489" y2="294" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 07 purchase -->
    <text x="390" y="316">07 purchase(product_id, reason)</text>
    <line x1="285" y1="324" x2="489" y2="324" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 08 signed checkout -->
    <rect x="322" y="336" width="350" height="22" rx="11" fill="#f0efff" />
    <text x="497" y="351" fill="#3d34d6" font-weight="700">08 signed checkout &#183; ed25519 &#183; nonce</text>
    <line x1="495" y1="362" x2="704" y2="362" stroke="#3d34d6" stroke-width="2" marker-end="url(#ar-i)" />

    <!-- 09 live status + nonce -->
    <text x="602" y="384">09 verify mandate live &#183; consume nonce</text>
    <line x1="710" y1="392" x2="501" y2="392" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 10 store self: verify -->
    <text x="700" y="410" text-anchor="end">10 verify signature &#183; scope &#183; delivery</text>
    <path d="M710 404 L770 404 L770 420 L713 420" fill="none" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 11 store result -->
    <text x="602" y="442">11 result + total_cents + fulfillment</text>
    <line x1="710" y1="450" x2="501" y2="450" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 12 settle -> vault -->
    <text x="700" y="472" fill="#9a4c00">12 atomic settle &#183; per-mandate lock &#8594; vt_*</text>
    <line x1="495" y1="480" x2="899" y2="480" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar-a)" />

    <!-- 13 decision -->
    <text x="390" y="502">13 approved &#183; escalated &#183; refused</text>
    <line x1="495" y1="510" x2="291" y2="510" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 14 revoke -->
    <text x="295" y="532" fill="#b3093c">14 revoke_mandate &#8594; in-flight refused</text>
    <line x1="95" y1="540" x2="489" y2="540" stroke="#df1b41" stroke-width="1.8" marker-end="url(#ar-r)" />
  </g>

  <!-- amendment note -->
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="13" fill="#697386">
    <text x="495" y="580" text-anchor="middle">amend, never revoke-and-recreate: a signed mandate is immutable;</text>
    <text x="495" y="598" text-anchor="middle">signing the replacement draft retires the old one at that instant</text>
  </g>

  <!-- footnotes -->
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="13" fill="#697386">
    <line x1="40" y1="612" x2="960" y2="612" stroke="#e3e8ee" stroke-width="1" />
    <text x="40" y="634">connect once: POST /mcp &#8594; oauth 2.1 + pkce &#8594; consent screen</text>
    <text x="40" y="654">v2 services: internal proofs es256/jws over rfc 8785 jcs &#183; decisions carry explanation + remedy + next_tool</text>
    <text x="40" y="674">settlement and revocation share one per-mandate db lock &#183; live status lives in the registry</text>
  </g>
</svg>
