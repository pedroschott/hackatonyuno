<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690">
  <defs>
    <pattern id="pr-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#635bff" stroke-opacity="0.05" />
    </pattern>
    <marker id="ar-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#635bff" />
    </marker>
    <marker id="ar-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8a93ab" />
    </marker>
    <marker id="ar-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#d97706" />
    </marker>
    <marker id="ar-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#df1b41" />
    </marker>
    <marker id="ar-i" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#3d34d6" />
    </marker>
  </defs>

  <rect width="1000" height="690" fill="#f7f8fa" />
  <rect x="14" y="14" width="972" height="662" rx="14" fill="#ffffff" />
  <rect x="14" y="14" width="972" height="662" rx="14" fill="url(#pr-grid)" />
  <rect x="14" y="14" width="972" height="662" rx="14" fill="none" stroke="#e3e8ee" stroke-width="1.5" />

  <text x="40" y="46" font-family="'Geist Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#1a1f36">mandated_purchase &#183; sequence</text>
  <text x="40" y="64" font-family="'Geist Mono','Fira Code',monospace" font-size="10.5" fill="#697386">deployed path: agent &#8594; agentpay &#8594; store &#8594; settle (payment rail intentionally mocked)</text>

  <!-- lifelines -->
  <g stroke="#d7dcf0" stroke-width="1" stroke-dasharray="4 5">
    <line x1="95" y1="96" x2="95" y2="590" />
    <line x1="285" y1="96" x2="285" y2="590" />
    <line x1="495" y1="96" x2="495" y2="590" />
    <line x1="710" y1="96" x2="710" y2="590" />
    <line x1="905" y1="96" x2="905" y2="590" />
  </g>

  <!-- lane headers -->
  <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
    <rect x="30" y="76" width="130" height="38" rx="8" fill="#ffffff" stroke="#e3e8ee" />
    <text x="95" y="93" font-size="12" font-weight="700" fill="#1a1f36">user</text>
    <text x="95" y="107" font-size="9" fill="#8792a2">mandate owner</text>

    <rect x="215" y="76" width="140" height="38" rx="8" fill="#ffffff" stroke="#e3e8ee" />
    <text x="285" y="93" font-size="12" font-weight="700" fill="#1a1f36">agent</text>
    <text x="285" y="107" font-size="9" fill="#8792a2">mcp client</text>

    <rect x="415" y="76" width="160" height="38" rx="8" fill="#f0efff" stroke="#635bff" />
    <text x="495" y="93" font-size="12" font-weight="700" fill="#3d34d6">agentpay</text>
    <text x="495" y="107" font-size="9" fill="#5b51e8">app + mandate registry</text>

    <rect x="625" y="76" width="170" height="38" rx="8" fill="#ffffff" stroke="#e3e8ee" />
    <text x="710" y="93" font-size="12" font-weight="700" fill="#1a1f36">store</text>
    <text x="710" y="107" font-size="9" fill="#8792a2">@agentpay/merchant-sdk</text>

    <rect x="840" y="76" width="130" height="38" rx="8" fill="#ffffff" stroke="#d97706" stroke-dasharray="4 3" />
    <text x="905" y="93" font-size="12" font-weight="700" fill="#9a4c00">vault</text>
    <text x="905" y="107" font-size="9" fill="#9a4c00">mocked rail</text>
  </g>

  <g font-family="'Geist Mono','Fira Code',monospace" font-size="10.5" fill="#3c4257" text-anchor="middle">

    <!-- 01 discovery -->
    <text x="497" y="122">01 discovery &#183; GET /.well-known/agentpay.json + catalog</text>
    <line x1="285" y1="130" x2="704" y2="130" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 02 manifest -->
    <text x="497" y="152">02 manifest &#183; merchant id &#183; categories &#183; endpoints</text>
    <line x1="710" y1="160" x2="291" y2="160" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 03 create_mandate -->
    <text x="390" y="182">03 create_mandate(merchant_urls, categories, limits)</text>
    <line x1="285" y1="190" x2="489" y2="190" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 04 draft + authorization_url -->
    <text x="390" y="212">04 draft mandate + authorization_url</text>
    <line x1="495" y1="220" x2="291" y2="220" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 05 passkey sign -->
    <text x="295" y="242">05 sign with passkey &#183; webauthn &#183; registry co-signs &#8594; active</text>
    <line x1="95" y1="250" x2="489" y2="250" stroke="#3d34d6" stroke-width="1.8" marker-end="url(#ar-i)" />

    <!-- 06 check_purchase -->
    <text x="390" y="272">06 check_purchase &#8594; would_be (dry run, nothing recorded)</text>
    <line x1="285" y1="280" x2="489" y2="280" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 07 purchase -->
    <text x="390" y="302">07 purchase(product_id, purchase_reason)</text>
    <line x1="285" y1="310" x2="489" y2="310" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 08 signed checkout -->
    <rect x="295" y="322" width="404" height="17" rx="8.5" fill="#f0efff" />
    <text x="497" y="334" fill="#3d34d6" font-weight="700">08 signed checkout &#183; ed25519 &#183; canonical json &#183; nonce &#183; ship_to</text>
    <line x1="495" y1="342" x2="704" y2="342" stroke="#3d34d6" stroke-width="2" marker-end="url(#ar-i)" />

    <!-- 09 live status + nonce -->
    <text x="602" y="364">09 GET /api/registry/mandates/:id (live) &#183; POST /nonces (consume)</text>
    <line x1="710" y1="372" x2="501" y2="372" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 10 store self: verify -->
    <text x="775" y="390">10 verify signature &#183; nonce &#183; scope &#183; policy &#183; quote delivery</text>
    <path d="M710 398 L770 398 L770 414 L713 414" fill="none" stroke="#635bff" stroke-width="1.5" marker-end="url(#ar-b)" />

    <!-- 11 store result -->
    <text x="602" y="424">11 result + charge.total_cents + fulfillment</text>
    <line x1="710" y1="432" x2="501" y2="432" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 12 settle -> vault -->
    <text x="700" y="454" fill="#9a4c00">12 atomic settle (per-mandate lock) &#8594; vt_* single-use token</text>
    <line x1="495" y1="462" x2="899" y2="462" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar-a)" />

    <!-- 13 decision -->
    <text x="390" y="484">13 approved | escalated | refused + explanation &#183; remedy &#183; next_tool</text>
    <line x1="495" y1="492" x2="291" y2="492" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-m)" />

    <!-- 14 revoke -->
    <text x="295" y="514" fill="#b3093c">14 revoke_mandate &#8594; in-flight checkout refused MANDATE_REVOKED</text>
    <line x1="95" y1="522" x2="489" y2="522" stroke="#df1b41" stroke-width="1.8" marker-end="url(#ar-r)" />
  </g>

  <!-- amendment path note -->
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="10" fill="#697386">
    <text x="495" y="560" text-anchor="middle">amend, never revoke-and-recreate: a signed mandate is immutable;</text>
    <text x="495" y="575" text-anchor="middle">amend_mandate issues a replacement draft, and signing it retires the old one</text>
  </g>

  <!-- footnotes -->
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="9.5" fill="#8792a2">
    <line x1="40" y1="600" x2="960" y2="600" stroke="#e3e8ee" stroke-width="1" />
    <text x="40" y="620">connect (once): POST /mcp &#8594; 401 + protected-resource metadata &#8594; oauth 2.1 + PKCE &#8594; dynamic client registration &#8594; consent screen</text>
    <text x="40" y="638">v2 services (apps/mandate-api &#183; merchant-mocks &#183; payment-vault): internal request proofs ES256/JWS over RFC 8785 JCS</text>
    <text x="40" y="656">settlement and revocation take the same per-mandate database lock &#183; live status lives in the registry, never inside the token</text>
  </g>
</svg>
