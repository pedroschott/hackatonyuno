<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <filter id="ap-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="ap-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635bff" />
      <stop offset="100%" stop-color="#3d34d6" />
    </linearGradient>
    <pattern id="ap-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#635bff" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1000" height="300" fill="#f7f8fb" />
  <rect x="14" y="14" width="972" height="272" rx="14" fill="#ffffff" />
  <rect x="14" y="14" width="972" height="272" rx="14" fill="url(#ap-grid)" />
  <rect x="14" y="14" width="972" height="272" rx="14" fill="none" stroke="#e3e8ee" stroke-width="1.5" />

  <!-- brand -->
  <rect x="46" y="38" width="42" height="42" rx="11" fill="url(#ap-brand)" />
  <path d="M67 45.5 L75.5 48.8 V58.2 C75.5 64.2 72.1 67.8 67 70.2 C61.9 67.8 58.5 64.2 58.5 58.2 V48.8 Z" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round" />
  <path d="M62.8 57.6 l3 3 l6 -6.4" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
  <text x="100" y="78" font-family="'Geist','Inter',system-ui,sans-serif" font-size="48" font-weight="700" fill="#1a1f36" letter-spacing="0.3">AgentPay</text>
  <text x="101" y="102" font-family="'Geist','Inter',system-ui,sans-serif" font-size="14" fill="#697386">agents ask &#183; your passkey decides &#183; enforcement at settlement</text>

  <!-- live status -->
  <rect x="739" y="44" width="217" height="30" rx="6" fill="#ffffff" stroke="#e3e8ee" />
  <circle cx="755" cy="59" r="4" fill="#1f8f4e">
    <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="755" cy="59" r="4" fill="none" stroke="#1f8f4e" stroke-width="1">
    <animate attributeName="r" values="4;9" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="768" y="64" font-family="'Geist Mono','Fira Code',monospace" font-size="13" fill="#3c4257">agentpay-yuno.vercel.app</text>

  <!-- flow spine -->
  <line x1="70" y1="174" x2="930" y2="174" stroke="#dfe3f2" stroke-width="1.5" />
  <circle r="3.5" fill="#635bff" filter="url(#ap-soft)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M70 174 L930 174" />
  </circle>
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="14" fill="#aab3d6" text-anchor="middle">
    <text x="160" y="179">&#8594;</text>
    <text x="320" y="179">&#8594;</text>
    <text x="480" y="179">&#8594;</text>
    <text x="640" y="179">&#8594;</text>
    <text x="800" y="179">&#8594;</text>
  </g>

  <!-- nodes -->
  <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
    <circle cx="80" cy="174" r="19" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="80" y="179" font-size="13" font-weight="700" fill="#635bff">01</text>
    <text x="80" y="213" font-size="14" fill="#1a1f36">agent</text>
    <text x="80" y="232" font-size="13" fill="#697386">mcp client</text>

    <circle cx="240" cy="174" r="19" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="240" y="179" font-size="13" font-weight="700" fill="#635bff">02</text>
    <text x="240" y="213" font-size="14" fill="#1a1f36">oauth 2.1</text>
    <text x="240" y="232" font-size="13" fill="#697386">pkce + consent</text>

    <circle cx="400" cy="174" r="19" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="400" y="179" font-size="13" font-weight="700" fill="#635bff">03</text>
    <text x="400" y="213" font-size="14" fill="#1a1f36">mandate</text>
    <text x="400" y="232" font-size="13" fill="#697386">scope + limits</text>
  </g>

  <!-- passkey seal -->
  <g>
    <circle cx="560" cy="174" r="27" fill="none" stroke="#635bff" stroke-width="1.4">
      <animate attributeName="r" values="27;46" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="174" r="27" fill="none" stroke="#635bff" stroke-width="1.4">
      <animate attributeName="r" values="27;46" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="174" r="27" fill="#f0efff" stroke="#3d34d6" stroke-width="1.5" />
    <circle cx="560" cy="176" r="14.5" fill="none" stroke="#635bff" stroke-width="1.4" stroke-dasharray="44 12" transform="rotate(-80 560 176)" />
    <circle cx="560" cy="176" r="10" fill="none" stroke="#635bff" stroke-width="1.4" stroke-dasharray="28 9" transform="rotate(-40 560 176)" />
    <circle cx="560" cy="176" r="5.5" fill="none" stroke="#635bff" stroke-width="1.4" stroke-dasharray="15 6" transform="rotate(20 560 176)" />
    <circle cx="560" cy="167" r="2" fill="#635bff" />
    <circle cx="560" cy="140" r="11" fill="#ffffff" stroke="#3d34d6" stroke-width="1.4" />
    <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
      <text x="560" y="144.5" font-size="13" font-weight="700" fill="#3d34d6">04</text>
      <text x="560" y="213" font-size="14" fill="#1a1f36">passkey</text>
      <text x="560" y="232" font-size="13" fill="#697386">webauthn sign</text>
    </g>
  </g>

  <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
    <circle cx="720" cy="174" r="19" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="720" y="179" font-size="13" font-weight="700" fill="#635bff">05</text>
    <text x="720" y="213" font-size="14" fill="#1a1f36">checkout</text>
    <text x="720" y="232" font-size="13" fill="#697386">ed25519 + nonce</text>

    <circle cx="880" cy="174" r="19" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="880" y="179" font-size="13" font-weight="700" fill="#635bff">06</text>
    <text x="880" y="213" font-size="14" fill="#1a1f36">store</text>
    <text x="880" y="232" font-size="13" fill="#697386">sdk verifies live</text>
  </g>

  <!-- mandate strip -->
  <rect x="44" y="248" width="560" height="30" rx="6" fill="#f4f3ff" stroke="#dfe3f2" />
  <text x="58" y="268" font-family="'Geist Mono','Fira Code',monospace" font-size="13" fill="#3d34d6">mandate mnd_7f2a &#183; brakes @ partsroute &#183; $90/purch &#183; $150/mo &#183; 7d</text>

  <!-- decision legend -->
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="13">
    <circle cx="697" cy="264" r="4" fill="#0b6b35" />
    <text x="707" y="268" fill="#0b6b35">approved</text>
    <circle cx="795" cy="264" r="4" fill="#9a4c00" />
    <text x="805" y="268" fill="#9a4c00">escalated</text>
    <circle cx="893" cy="264" r="4" fill="#b3093c" />
    <text x="903" y="268" fill="#b3093c">refused</text>
  </g>
</svg>
