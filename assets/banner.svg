<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <filter id="ap-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="ap-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635bff" />
      <stop offset="100%" stop-color="#3d34d6" />
    </linearGradient>
    <pattern id="ap-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#635bff" stroke-opacity="0.05" />
    </pattern>
    <clipPath id="ap-type">
      <rect x="0" y="246" width="0" height="24">
        <animate attributeName="width" from="0" to="480" dur="2.6s" begin="0.5s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="300" fill="#f7f8fa" />
  <rect x="14" y="14" width="972" height="272" rx="14" fill="#ffffff" />
  <rect x="14" y="14" width="972" height="272" rx="14" fill="url(#ap-grid)" />
  <rect x="14" y="14" width="972" height="272" rx="14" fill="none" stroke="#e3e8ee" stroke-width="1.5" />

  <!-- brand -->
  <rect x="46" y="42" width="34" height="34" rx="9" fill="url(#ap-brand)" />
  <path d="M63 47.5 L70.5 50.3 V57.4 C70.5 62.8 67.4 66 63 68 C58.6 66 55.5 62.8 55.5 57.4 V50.3 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M59.6 57.2 l2.6 2.6 l5.4 -5.6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <text x="92" y="66" font-family="'Geist','Inter',system-ui,sans-serif" font-size="30" font-weight="700" fill="#1a1f36" letter-spacing="0.3">AgentPay</text>
  <text x="93" y="87" font-family="'Geist','Inter',system-ui,sans-serif" font-size="12.5" fill="#697386">agents ask · your passkey decides · enforcement at settlement</text>

  <!-- live chip -->
  <rect x="770" y="46" width="186" height="26" rx="13" fill="#ffffff" stroke="#e3e8ee" />
  <circle cx="786" cy="59" r="3.5" fill="#1f8f4e">
    <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="786" cy="59" r="3.5" fill="none" stroke="#1f8f4e" stroke-width="1">
    <animate attributeName="r" values="3.5;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="799" y="63" font-family="'Geist Mono','Fira Code',monospace" font-size="11" fill="#3c4257">agentpay-yuno.vercel.app</text>

  <!-- flow spine -->
  <line x1="80" y1="172" x2="880" y2="172" stroke="#dfe3f2" stroke-width="1.5" />
  <circle r="3.5" fill="#635bff" filter="url(#ap-soft)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M80 172 L880 172" />
  </circle>
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="13" fill="#aab3d6" text-anchor="middle">
    <text x="160" y="177">&#8594;</text>
    <text x="320" y="177">&#8594;</text>
    <text x="480" y="177">&#8594;</text>
    <text x="640" y="177">&#8594;</text>
    <text x="800" y="177">&#8594;</text>
  </g>

  <!-- nodes -->
  <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
    <circle cx="80" cy="172" r="17" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="80" y="176" font-size="10.5" font-weight="700" fill="#635bff">01</text>
    <text x="80" y="208" font-size="11.5" fill="#1a1f36">agent</text>
    <text x="80" y="223" font-size="9.5" fill="#8792a2">mcp client</text>

    <circle cx="240" cy="172" r="17" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="240" y="176" font-size="10.5" font-weight="700" fill="#635bff">02</text>
    <text x="240" y="208" font-size="11.5" fill="#1a1f36">oauth 2.1</text>
    <text x="240" y="223" font-size="9.5" fill="#8792a2">pkce + consent</text>

    <circle cx="400" cy="172" r="17" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="400" y="176" font-size="10.5" font-weight="700" fill="#635bff">03</text>
    <text x="400" y="208" font-size="11.5" fill="#1a1f36">mandate</text>
    <text x="400" y="223" font-size="9.5" fill="#8792a2">scope + limits</text>
  </g>

  <!-- webauthn seal -->
  <g>
    <circle cx="560" cy="172" r="24" fill="none" stroke="#635bff" stroke-width="1.4">
      <animate attributeName="r" values="24;42" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.55;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="172" r="24" fill="none" stroke="#635bff" stroke-width="1.4">
      <animate attributeName="r" values="24;42" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.55;0" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="172" r="24" fill="#f0efff" stroke="#3d34d6" stroke-width="1.5" />
    <circle cx="560" cy="174" r="13" fill="none" stroke="#635bff" stroke-width="1.3" stroke-dasharray="40 11" transform="rotate(-80 560 174)" />
    <circle cx="560" cy="174" r="9" fill="none" stroke="#635bff" stroke-width="1.3" stroke-dasharray="26 8" transform="rotate(-40 560 174)" />
    <circle cx="560" cy="174" r="5" fill="none" stroke="#635bff" stroke-width="1.3" stroke-dasharray="14 5" transform="rotate(20 560 174)" />
    <circle cx="560" cy="167" r="1.8" fill="#635bff" />
    <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
      <text x="560" y="141" font-size="10.5" font-weight="700" fill="#3d34d6">04</text>
      <text x="560" y="208" font-size="11.5" fill="#1a1f36">passkey</text>
      <text x="560" y="223" font-size="9.5" fill="#8792a2">webauthn sign</text>
    </g>
  </g>

  <g font-family="'Geist Mono','Fira Code',monospace" text-anchor="middle">
    <circle cx="720" cy="172" r="17" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="720" y="176" font-size="10.5" font-weight="700" fill="#635bff">05</text>
    <text x="720" y="208" font-size="11.5" fill="#1a1f36">checkout</text>
    <text x="720" y="223" font-size="9.5" fill="#8792a2">ed25519 + nonce</text>

    <circle cx="880" cy="172" r="17" fill="#ffffff" stroke="#635bff" stroke-width="1.6" />
    <text x="880" y="176" font-size="10.5" font-weight="700" fill="#635bff">06</text>
    <text x="880" y="208" font-size="11.5" fill="#1a1f36">store</text>
    <text x="880" y="223" font-size="9.5" fill="#8792a2">sdk verifies live</text>
  </g>

  <!-- typewriter -->
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="12.5">
    <text x="44" y="265" fill="#3d34d6" font-weight="700">$</text>
    <g clip-path="url(#ap-type)">
      <text x="60" y="265" fill="#1a1f36">curl https://partsroute.vercel.app/.well-known/agentpay.json</text>
    </g>
    <rect x="518" y="252" width="8" height="15" fill="#635bff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- decision chips -->
  <g font-family="'Geist Mono','Fira Code',monospace" font-size="10" text-anchor="middle">
    <rect x="648" y="248" width="82" height="21" rx="10.5" fill="#e3f5ea" />
    <text x="689" y="262" fill="#0b6b35">approved</text>
    <rect x="738" y="248" width="88" height="21" rx="10.5" fill="#fef3d7" />
    <text x="782" y="262" fill="#9a4c00">escalated</text>
    <rect x="834" y="248" width="74" height="21" rx="10.5" fill="#fde8ee" />
    <text x="871" y="262" fill="#b3093c">refused</text>
    <text x="636" y="262" text-anchor="end" fill="#8792a2" font-size="9.5">decisions &#8594;</text>
  </g>
</svg>
